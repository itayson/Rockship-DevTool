name: Android CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.9
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p app/build/ci-logs devcontrol/build/ci-logs
          ./gradlew :app:testDebugUnitTest :devcontrol:testDebugUnitTest --stacktrace 2>&1 | tee app/build/ci-logs/unit-tests.log
      - name: Build debug APKs
        shell: bash
        run: |
          set -o pipefail
          mkdir -p app/build/ci-logs devcontrol/build/ci-logs
          ./gradlew :app:assembleDebug :devcontrol:assembleDebug --stacktrace 2>&1 | tee app/build/ci-logs/assemble-debug.log
      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p app/build/ci-logs devcontrol/build/ci-logs
          ./gradlew :app:lintDebug :devcontrol:lintDebug --stacktrace 2>&1 | tee app/build/ci-logs/lint-debug.log
      - name: Lint summary
        if: always()
        run: |
          if [ "${{ steps.lint.outcome }}" = "failure" ]; then
            echo "::warning::Os APKs foram compilados, mas o Android Lint encontrou problemas. Os relatórios foram anexados ao artefato."
          fi
      - name: Upload APKs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-builds
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            devcontrol/build/outputs/apk/debug/devcontrol-debug.apk
            app/build/reports/tests/
            app/build/test-results/
            app/build/ci-logs/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
            app/build/reports/lint-results-debug.xml
            devcontrol/build/reports/tests/
            devcontrol/build/test-results/
            devcontrol/build/ci-logs/
            devcontrol/build/reports/lint-results-debug.html
            devcontrol/build/reports/lint-results-debug.txt
            devcontrol/build/reports/lint-results-debug.xml
