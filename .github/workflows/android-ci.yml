name: Android CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.9
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: rockflash-devtool-debug
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
