name: Release APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "app/build.gradle.kts"

permissions:
  contents: write

concurrency:
  group: release-rockflash-apk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ler versão
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK, NDK e CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Gerar wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Testar, compilar e executar lint
        run: |
          ./gradlew :app:testDebugUnitTest --stacktrace
          ./gradlew :app:assembleDebug --stacktrace
          ./gradlew :app:lintDebug --stacktrace

      - name: Preparar arquivos
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          APK="RockFlash-DevTool-$VERSION.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          test -s "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Criar ou atualizar release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          APK="RockFlash-DevTool-$VERSION.apk"
          PRERELEASE_ARGS=()
          if [[ "$VERSION" == *alpha* || "$VERSION" == *beta* || "$VERSION" == *rc* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi

          cat > RELEASE_NOTES.md <<EOF
          RockFlash DevTool $VERSION

          APK Android compilado e validado automaticamente pelo GitHub Actions.

          - testes unitários executados;
          - Android Lint executado;
          - arquivo SHA-256 incluído;
          - origem: commit $GITHUB_SHA.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "RockFlash DevTool $VERSION" \
              --notes-file RELEASE_NOTES.md \
              "${PRERELEASE_ARGS[@]}"
            gh release upload "$TAG" "$APK" "$APK.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "RockFlash DevTool $VERSION" \
              --notes-file RELEASE_NOTES.md \
              "${PRERELEASE_ARGS[@]}"
          fi
